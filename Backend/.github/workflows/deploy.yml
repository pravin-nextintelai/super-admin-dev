name: Deploy backend (Cloud Run)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Backend/**']

defaults:
  run:
    working-directory: Backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build & push image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/super-admin/backend:${{ github.sha }}"
          gcloud builds submit --tag "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy
        run: |
          gcloud run deploy super-admin-backend \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --update-secrets "JWT_SECRET=jwt-secret:latest,DATABASE_URL=db-url:latest,DOCDB_URL=docdb-url:latest,PAYMENT_DB_URL=payment-db-url:latest"
